# Project-wide Gradle settings.
android.useAndroidX=true
android.enableJetifier=false
kotlin.code.style=official
# Memory caps: two modules plus Room KSP means the Gradle and Kotlin daemons
# must both bound their heap AND their metaspace — overriding jvmargs drops
# Gradle's default MaxMetaspaceSize, which is what lets the daemons grow
# without limit. With these caps the bounded peak is roughly 8.5 GiB.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.workers.max=4
kotlin.daemon.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m
org.gradle.caching=true
