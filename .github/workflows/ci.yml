name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── the TypeScript workspace: protocol, daemon, cli, webui ─────────────────
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # version comes from package.json packageManager

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # node-pty is the terminal.* PTY backend and the only dependency allowed
      # to run a postinstall (pnpm-workspace.yaml onlyBuiltDependencies). The
      # daemon's terminal tests drive REAL PTYs and assert the module loads, so
      # a missing native build is a hard failure rather than a skip — rebuild
      # explicitly instead of trusting install-time ordering.
      - name: Build node-pty
        working-directory: packages/daemon
        run: pnpm rebuild node-pty

      - run: pnpm -r build

      - run: pnpm -r test

  # ── the Android client ─────────────────────────────────────────────────────
  # :shared has no binary dependencies, so its unit tests — including the
  # protocol-fixture conformance suite that reads packages/protocol/fixtures —
  # run from a bare checkout. :app links prebuilt .aar/.so binaries that are
  # kept out of git, so its suite is gated on the asset release existing.
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Configure the toolchain
        run: echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

      # The runner image ships an Android SDK; make sure it has the platform the
      # modules compile against. No-op when it is already installed.
      - name: Ensure the compile SDK is installed
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-35" "build-tools;35.0.0" >/dev/null

      # The wire contract, both directions: this is the job that makes "the host
      # changed and the client did not notice" impossible to merge.
      - name: Protocol fixture conformance (:shared)
        run: ./gradlew --no-daemon :shared:desktopTest

      - name: Compile the client
        run: ./gradlew --no-daemon :shared:assemble

      # The full :app suite needs the binary assets. Until an asset release
      # exists, set the MARMALADE_ASSETS_BASE_URL repository variable to turn
      # this on; without it the job says so rather than silently passing.
      - name: Fetch binary assets
        if: vars.MARMALADE_ASSETS_BASE_URL != ''
        env:
          MARMALADE_ASSETS_BASE_URL: ${{ vars.MARMALADE_ASSETS_BASE_URL }}
        run: ./scripts/fetch-assets.sh

      - name: App unit tests
        if: vars.MARMALADE_ASSETS_BASE_URL != ''
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: App unit tests skipped
        if: vars.MARMALADE_ASSETS_BASE_URL == ''
        run: |
          echo "::notice title=:app tests skipped::MARMALADE_ASSETS_BASE_URL is not set, so the" \
               "prebuilt .aar/.so/.onnx assets cannot be fetched and :app cannot be built." \
               "Set the repository variable once an asset release is published."
